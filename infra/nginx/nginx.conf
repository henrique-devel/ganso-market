worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format ganso_json escape=json '{"timestamp":"$time_iso8601",'
        '"level":"info","service":"nginx-edge",'
        '"event":"http_request_completed","correlation_id":"$request_id",'
        '"method":"$request_method","status":$status,'
        '"request_time_seconds":$request_time}';
    access_log /dev/stdout ganso_json;
    error_log /dev/stderr warn;
    server_tokens off;
    sendfile on;

    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;

    client_max_body_size 16k;

    # Login attempts are rate limited at the edge in addition to the
    # application-level progressive delay and lockout (PRD AUTH-10).
    limit_req_zone $binary_remote_addr zone=login:1m rate=20r/m;
    # The kill-switch rearm is a rare human action; its own zone so a burst on
    # it cannot eat the login budget and lock the operator out.
    limit_req_zone $binary_remote_addr zone=killswitch:1m rate=6r/m;
    limit_req_status 429;

    # Reject unexpected Host headers instead of serving the application
    # (PRD NET-07). Loopback covers dev and the smoke test; the public IP is the
    # standalone deployment.
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 8080;
        server_name 127.0.0.1 localhost 178.105.65.251;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy
            "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
            always;

        location = /api/health/live {
            proxy_pass http://api:3000/health/live;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/health/ready {
            proxy_pass http://api:3000/health/ready;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        # Login carries its own rate limit; $http_host preserves the port so the
        # API's Origin/Host equality check succeeds.
        location = /api/auth/login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://api:3000/auth/login;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $http_host;
        }

        location ^~ /api/auth/ {
            proxy_pass http://api:3000/auth/;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $http_host;
        }

        # RFC-012 dashboard (owner decision, 2026-08-24): the resolution-risk
        # and graph READ surfaces are published, GET only, behind the RFC-002
        # session auth (Bearer passes through untouched) and the Hetzner
        # firewall that already pins port 80 to the operator's IP. Any other
        # method — including POST /api/polymarket/graph/edges, the curated
        # edge writer — stays closed at the edge like the rest of /api/*.
        location ^~ /api/polymarket/resolution-risk {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/polymarket/resolution-risk;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location ^~ /api/polymarket/graph {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/polymarket/graph;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        # RFC-013 dashboard: the portfolio READ surfaces, GET only, same
        # perimeter rule as the RFC-012 block above. POST
        # /api/polymarket/portfolio/halt and /resume are the manual state
        # controls and stay CLOSED at the edge — leaving HALTED is exactly the
        # action that must not be reachable from outside.
        location ^~ /api/polymarket/opportunities {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/polymarket/opportunities;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location ^~ /api/polymarket/portfolio {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/polymarket/portfolio;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location ^~ /api/polymarket/gates {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/polymarket/gates;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location ^~ /api/polymarket/decisions {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/polymarket/decisions;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        # RFC-015 operator dashboard. Three read surfaces, all EXACT paths and
        # all GET only.
        #
        # `overview` and `events` are new aggregates over tables the surfaces
        # above already publish; `data-quality` was closed until its
        # `budget_used_pct` stopped disagreeing with QUOTA_GLOBAL_ALARM
        # (RFC-015 §9) — publishing a number that means something other than
        # what its name says is worse than not publishing it.
        #
        # Exact, not prefix, for the same reason as the rearm below: a prefix is
        # a promise about paths that do not exist yet.
        location = /api/polymarket/overview {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/polymarket/overview;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/polymarket/events {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/polymarket/events;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/polymarket/data-quality {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/polymarket/data-quality;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        # RFC-011 performance report, published by owner decision (2026-08-28):
        # it is where the panel's unrealised PnL and fees come from, and without
        # it the PnL band would print realised-only and call it PnL.
        #
        # An EXACT path, like the rearm. `^~ /api/polymarket/paper` would also
        # publish POST /api/polymarket/paper/intents, which CREATES orders.
        # scripts/tests/test_nginx_perimeter.py holds the allowlist of paper
        # paths that may be named at all, and fails on a prefix.
        location = /api/polymarket/paper/performance {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/polymarket/paper/performance;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        # RFC-011 kill switch rearm, published by owner decision (2026-08-27) so
        # the rearm can be done from the panel instead of from inside the server.
        # It is the ONLY write this perimeter publishes.
        #
        # An EXACT path, not a prefix. `^~ /api/polymarket/paper` would also
        # publish `POST /api/polymarket/paper/intents`, which CREATES orders —
        # the one surface in this module that must never be reachable from
        # outside. `location =` cannot match it, and
        # scripts/tests/test_nginx_perimeter.py fails if a prefix appears.
        #
        # No GET here: the state already rides on
        # GET /api/polymarket/resolution-risk/pipeline, which the panel already
        # reads and renders. And no engage: the switch has automatic triggers
        # (recorder staleness, daily loss), so stopping does not need a human,
        # and a manual halt stays an action taken from inside. The RFC-013
        # portfolio halt/resume also stay closed.
        location = /api/polymarket/paper/kill-switch/rearm {
            if ($request_method != POST) {
                return 404;
            }
            limit_req zone=killswitch burst=3 nodelay;
            proxy_pass http://api:3000/polymarket/paper/kill-switch/rearm;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $http_host;
        }

        # Every other /api/* path (including /api/metrics) stays closed.
        location ^~ /api/ {
            return 404;
        }

        location / {
            proxy_pass http://web:8080;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }
    }
}
