worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format ganso_json escape=json '{"timestamp":"$time_iso8601",'
        '"level":"info","service":"nginx-edge",'
        '"event":"http_request_completed","correlation_id":"$request_id",'
        '"method":"$request_method","status":$status,'
        '"request_time_seconds":$request_time}';
    access_log /dev/stdout ganso_json;
    error_log /dev/stderr warn;
    server_tokens off;
    sendfile on;

    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;

    client_max_body_size 16k;

    # Login attempts are rate limited at the edge in addition to the
    # application-level progressive delay and lockout (PRD AUTH-10).
    limit_req_zone $binary_remote_addr zone=login:1m rate=20r/m;
    # The kill-switch rearm is a rare human action; its own zone so a burst on
    # it cannot eat the login budget and lock the operator out.
    limit_req_zone $binary_remote_addr zone=killswitch:1m rate=6r/m;
    limit_req_status 429;

    # Reject unexpected Host headers instead of serving the application
    # (PRD NET-07). Loopback covers dev and the smoke test; the public IP is the
    # standalone deployment.
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 8080;
        server_name 127.0.0.1 localhost 178.105.65.251;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy
            "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
            always;

        location = /api/health/live {
            proxy_pass http://api:3000/health/live;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/health/ready {
            proxy_pass http://api:3000/health/ready;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        # Login carries its own rate limit; $http_host preserves the port so the
        # API's Origin/Host equality check succeeds.
        location = /api/auth/login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://api:3000/auth/login;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $http_host;
        }

        location ^~ /api/auth/ {
            proxy_pass http://api:3000/auth/;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $http_host;
        }

        # Authenticated BTC reads and commands, exact paths and methods.
        location = /api/trading/experiment-datasets {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/trading/experiment-datasets;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/trading/experiments {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/trading/experiments;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/trading/experiment-system {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/trading/experiment-system;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/trading/jev {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/trading/jev;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/trading/accounts {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/trading/accounts;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/trading/account {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/trading/account;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/trading/positions {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/trading/positions;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/trading/orders {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/trading/orders;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/trading/operation {
            if ($request_method != GET) {
                return 404;
            }
            proxy_pass http://api:3000/trading/operation;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        # G2-06.2: explicit paper commands; no execute/advance/live wildcard.
        location = /api/trading/preview {
            if ($request_method != POST) {
                return 404;
            }
            proxy_pass http://api:3000/trading/preview;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $http_host;
        }

        location = /api/trading/submit {
            if ($request_method != POST) {
                return 404;
            }
            proxy_pass http://api:3000/trading/submit;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $http_host;
        }

        location = /api/trading/cancel {
            if ($request_method != POST) {
                return 404;
            }
            proxy_pass http://api:3000/trading/cancel;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $http_host;
        }

        location = /api/trading/close {
            if ($request_method != POST) {
                return 404;
            }
            proxy_pass http://api:3000/trading/close;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $http_host;
        }

        location = /api/trading/pause {
            if ($request_method != POST) {
                return 404;
            }
            proxy_pass http://api:3000/trading/pause;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $http_host;
        }

        # Every other /api/* path (including /api/metrics) stays closed.
        location ^~ /api/ {
            return 404;
        }

        location / {
            proxy_pass http://web:8080;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }
    }
}
