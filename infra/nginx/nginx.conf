worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format ganso_json escape=json '{"timestamp":"$time_iso8601",'
        '"level":"info","service":"nginx-edge",'
        '"event":"http_request_completed","correlation_id":"$request_id",'
        '"method":"$request_method","status":$status,'
        '"request_time_seconds":$request_time}';
    access_log /dev/stdout ganso_json;
    error_log /dev/stderr warn;
    server_tokens off;
    sendfile on;

    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;

    server {
        listen 8080;
        server_name _;

        location = /api/health/live {
            proxy_pass http://api:3000/health/live;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location = /api/health/ready {
            proxy_pass http://api:3000/health/ready;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }

        location ^~ /api/ {
            return 404;
        }

        location / {
            proxy_pass http://web:8080;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
        }
    }
}
