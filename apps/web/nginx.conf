pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format ganso_json escape=json '{"timestamp":"$time_iso8601",'
    '"level":"info","service":"web-static",'
    '"event":"http_request_completed","correlation_id":"$http_x_correlation_id",'
    '"method":"$request_method","status":$status,'
    '"request_time_seconds":$request_time}';
  access_log /dev/stdout ganso_json;
  error_log /dev/stderr warn;
  log_not_found off;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The edge gateway owns health routing. This static server exposes no API.
    location /api/ {
      return 404;
    }

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store";
    }
  }
}
