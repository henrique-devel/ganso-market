[package]
name = "ganso-market-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
time = { version = "=0.3.55", features = ["formatting", "serde"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "=0.7.18"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
uuid = { version = "=1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.24.0"
tower = { version = "=0.5.3", features = ["util"] }
