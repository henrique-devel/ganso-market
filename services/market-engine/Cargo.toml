[package]
name = "ganso-market-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bs58 = "=0.5.1"
futures = "=0.3.33"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["formatting", "serde"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "=0.7.18"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
uuid = { version = "=1.24.0", features = ["v4"] }
yellowstone-grpc-client = "=13.3.0"
yellowstone-grpc-proto = "=12.5.0"

[dev-dependencies]
tempfile = "=3.24.0"
tower = { version = "=0.5.3", features = ["util"] }
