name: ganso-market

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_DB: ganso_market
      POSTGRES_USER: ganso_market
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "max_connections=40"]
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganso_market -d ganso_market"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    logging: *default-logging

  migrate:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ganso_market
      PGUSER: ganso_market
      GANSO_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: UTC
    entrypoint: ["/bin/sh", "/migrations/apply.sh"]
    secrets:
      - postgres_password
    volumes:
      - ./infra/migrations/apply.sh:/migrations/apply.sh:ro
      - ./migrations:/migrations/sql:ro
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging

  market-engine:
    build:
      context: .
      dockerfile: services/market-engine/Dockerfile
    environment:
      GANSO_CONFIG_FILE: /etc/ganso/runtime.json
      GANSO_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./config/runtime.json:/etc/ganso/runtime.json:ro
    expose:
      - "8081"
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      GANSO_CONFIG_FILE: /etc/ganso/runtime.json
      GANSO_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./config/runtime.json:/etc/ganso/runtime.json:ro
    expose:
      - "3000"
    networks:
      - backend
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    expose:
      - "8080"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 5s
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging

  model-worker:
    profiles: ["model"]
    build:
      context: .
      dockerfile: workers/model-worker/Dockerfile
    environment:
      GANSO_CONFIG_FILE: /etc/ganso/runtime.json
    volumes:
      - ./config/runtime.json:/etc/ganso/runtime.json:ro
    expose:
      - "8090"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    # RFC-011 decision (2026-08-23): the stub worker cedes memory to the new
    # polymarket-paper service. 96m, not 128m: the compose policy cap is a
    # strict < 4 GiB and 128m would land the aggregate exactly on the cap.
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 64
    logging: *default-logging

  polymarket-recorder:
    profiles: ["polymarket"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/polymarket-recorder.js"]
    environment:
      GANSO_CONFIG_FILE: /etc/ganso/runtime.json
      GANSO_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      GANSO_MACRO_CALENDAR_FILE: /etc/ganso/macro-calendar.json
    secrets:
      - postgres_password
    volumes:
      - ./config/runtime.json:/etc/ganso/runtime.json:ro
      - ./config/macro-calendar.json:/etc/ganso/macro-calendar.json:ro
    networks:
      # backend reaches PostgreSQL; edge provides outbound internet to the public
      # Polymarket APIs. No host port is published.
      - backend
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 10s
    # 832m, not 1024m: the 192m released here funds the RFC-013 portfolio
    # engine below, and the recorder measured 230 MiB in production on
    # 2026-08-26 with the full 100-market/200-token universe — 3.6x headroom
    # remains. The compose aggregate stays exactly where it was.
    mem_limit: 832m
    cpus: 0.5
    pids_limit: 128
    logging: *default-logging

  # RFC-010 fundamental model. Estimates and calibration reports only: no order,
  # no paper order, no signal, no wallet, no signer. It runs beside the recorder
  # rather than inside it so training and calibration never share the recorder's
  # hot path. It needs no outbound internet — every input is already in the
  # database — so it joins only the internal backend network.
  polymarket-estimator:
    profiles: ["polymarket"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      [
        "node",
        "--max-old-space-size=160",
        "apps/api/dist/polymarket-estimator.js",
      ]
    environment:
      GANSO_CONFIG_FILE: /etc/ganso/runtime.json
      GANSO_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      GANSO_FUNDAMENTAL_CONFIG_FILE: /etc/ganso/fundamental.json
      # The revision is baked into the image (apps/api/Dockerfile), so the
      # provenance on an estimate is always the code that produced it.
      GANSO_RELEASE_SHA_FILE: /etc/ganso/release-sha
    secrets:
      - postgres_password
    volumes:
      - ./config/runtime.json:/etc/ganso/runtime.json:ro
      - ./config/fundamental.json:/etc/ganso/fundamental.json:ro
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 10s
    # RFC-012 decision (2026-08-24): the estimator (39 MiB measured in
    # production) cedes 384 -> 192 MiB to fund the new polymarket-resolution
    # service; the compose policy cap stays strictly under 4 GiB.
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    logging: *default-logging

  # RFC-012 resolution-risk score and logical market graph. Analytics only:
  # scores, vetoes, EV buffers and consistency signals over recorded data — no
  # order, no paper order, no execution path (the module's scope test enforces
  # it). It joins edge ONLY for the read-only eth_getLogs polling of the UMA
  # Adapter on a public Polygon RPC (task 1, part 2); everything else it reads
  # is already in the database.
  polymarket-resolution:
    profiles: ["polymarket"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      [
        "node",
        "--max-old-space-size=160",
        "apps/api/dist/polymarket-resolution.js",
      ]
    environment:
      GANSO_CONFIG_FILE: /etc/ganso/runtime.json
      GANSO_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      GANSO_RESOLUTION_CONFIG_FILE: /etc/ganso/resolution.json
      GANSO_RESOLUTION_LEXICON_FILE: /etc/ganso/resolution-lexicon.json
      GANSO_GRAPH_EDGES_FILE: /etc/ganso/graph-edges.json
      # The revision is baked into the image (apps/api/Dockerfile), so the
      # provenance on a score is always the code that produced it.
      GANSO_RELEASE_SHA_FILE: /etc/ganso/release-sha
    secrets:
      - postgres_password
    volumes:
      - ./config/runtime.json:/etc/ganso/runtime.json:ro
      - ./config/resolution.json:/etc/ganso/resolution.json:ro
      - ./config/resolution-lexicon.json:/etc/ganso/resolution-lexicon.json:ro
      - ./config/graph-edges.json:/etc/ganso/graph-edges.json:ro
    networks:
      - backend
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    logging: *default-logging

  # RFC-011 paper broker (foundation). Simulation only — SIMULAÇÃO, SEM
  # EXECUÇÃO REAL: no trading auth, wallet, signer or real order path may ever
  # exist in this process (the module's scope test enforces it). Every input is
  # already in the database, so it joins only the internal backend network.
  polymarket-paper:
    profiles: ["polymarket"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      ["node", "--max-old-space-size=192", "apps/api/dist/polymarket-paper.js"]
    environment:
      GANSO_CONFIG_FILE: /etc/ganso/runtime.json
      GANSO_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # The revision is baked into the image (apps/api/Dockerfile), so the
      # provenance on a paper fill is always the code that produced it.
      GANSO_RELEASE_SHA_FILE: /etc/ganso/release-sha
    secrets:
      - postgres_password
    volumes:
      - ./config/runtime.json:/etc/ganso/runtime.json:ro
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *default-logging

  # RFC-013 portfolio engine. SIMULAÇÃO — SEM EXECUÇÃO REAL: no trading auth,
  # wallet, signer, real order path or stop-loss may ever exist in this process
  # (the module's scope test enforces it, and forbids even the identifiers).
  # Every input is already in the database, so it joins only the internal
  # backend network — it makes no outbound connection of its own.
  polymarket-portfolio:
    profiles: ["polymarket"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      [
        "node",
        "--max-old-space-size=160",
        "apps/api/dist/polymarket-portfolio.js",
      ]
    environment:
      GANSO_CONFIG_FILE: /etc/ganso/runtime.json
      GANSO_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      GANSO_PORTFOLIO_CONFIG_FILE: /etc/ganso/portfolio.json
      GANSO_PORTFOLIO_FACTOR_MAP_FILE: /etc/ganso/factor-map.json
      # RFC-018 D2: the `fonteResolucao` cap buckets by family of resolution
      # clause, classified with the RFC-012 vocabulary. The SAME file the
      # resolution service reads, not a copy — two vocabularies would be two
      # answers to "what decides this market".
      GANSO_RESOLUTION_LEXICON_FILE: /etc/ganso/resolution-lexicon.json
      GANSO_RELEASE_SHA_FILE: /etc/ganso/release-sha
    secrets:
      - postgres_password
    volumes:
      # Both files are COMPLETE, declaring every value rather than relying on
      # in-code defaults. That is deliberate: config/ is bind-mounted and lands
      # with the CD while the image updates only on a profile rebuild, so a
      # partial file would let an old binary mint a version name pinned to the
      # wrong content — exactly how score_version 1.1.0 was burned on
      # 2026-08-26 (see docs/runbooks/single-server.md).
      - ./config/runtime.json:/etc/ganso/runtime.json:ro
      - ./config/portfolio.json:/etc/ganso/portfolio.json:ro
      - ./config/factor-map.json:/etc/ganso/factor-map.json:ro
      - ./config/resolution-lexicon.json:/etc/ganso/resolution-lexicon.json:ro
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    logging: *default-logging

  nginx:
    image: nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    ports:
      - target: 8080
        published: "${GANSO_HTTP_PORT:-8080}"
        host_ip: "${GANSO_HTTP_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 5s
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging

secrets:
  postgres_password:
    file: ./infra/secrets/local/postgres_password

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  edge: {}
